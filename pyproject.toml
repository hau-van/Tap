[project]
name = "tap_agent"
version = "0.1.0"
description = "Mini coding agent — terminal CLI, Gemini, read + bash tools"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.1.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tap_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Suppress Windows asyncio ResourceWarning that fires when a subprocess pipe
# transport is garbage-collected after its event loop is already closed.
# This is a known CPython/Windows issue and does NOT indicate a test failure.
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
